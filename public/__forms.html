<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form detection</title>
  </head>
  <body>
    <!-- Netlify Forms detection skeleton — mirrors ContactModal.tsx fields -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="full_name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="address_line1" />
      <input type="text" name="city" />
      <input type="text" name="state" />
      <input type="text" name="zip" />
      <textarea name="notes"></textarea>
      <input type="text" name="source_button" />
    </form>
  </body>
</html>
